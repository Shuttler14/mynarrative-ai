deployment_targets:
  - id: DEP-001
    name: "Vercel (Serverless)"
    provider: Vercel
    projects: [PRJ-001, PRJ-004, PRJ-005]
    max_duration: 30s
    runtime: Python 3.11

  - id: DEP-002
    name: "Fly.io (Main API)"
    provider: Fly.io
    projects: [PRJ-002]
    app_name: drishti-api
    region: ams
    memory: 1024MB
    min_machines: 1
    auto_stop: false

  - id: DEP-003
    name: "Fly.io (Qdrant)"
    provider: Fly.io
    projects: []
    app_name: drishti-qdrant-moonlit-morning-7709
    region: ams
    memory: 512MB
    volume: drishti_qdrant_data

  - id: DEP-004
    name: "Shopify (Theme)"
    provider: Shopify
    projects: [PRJ-003]
    store: mynarrative.store
    theme_id: "140709101760"

  - id: DEP-005
    name: "Modal (GPU)"
    provider: Modal
    projects: [PRJ-006]
    gpu: T4
    image: NVIDIA CUDA 12.1.1

  - id: DEP-006
    name: "Docker (Microservices)"
    provider: Docker
    projects: [PRJ-007, PRJ-008]

  - id: DEP-007
    name: "Supabase (Database)"
    provider: Supabase
    projects: [PRJ-001, PRJ-003]
