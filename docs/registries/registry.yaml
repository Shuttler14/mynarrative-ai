# ============================================================
# DATABASES (DB)
# ============================================================
databases:
  - id: DB-001
    name: "Brands"
    table: brands
    repository: mynarrative-ai
    schema: supabase_b2b_complete.sql
    columns: [id, name, slug, logo_url, website_url, network_mode, is_approved, api_key_prefix, created_at, updated_at]
    notes: "No network_mode or wallet_balance columns in actual schema"

  - id: DB-002
    name: "API Keys"
    table: api_keys
    repository: mynarrative-ai
    schema: supabase_b2b_complete.sql
    columns: [id, brand_id, key_hash, key_prefix, name, is_active, created_at, last_used_at]

