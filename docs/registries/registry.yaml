    purpose: "Classification, embeddings, explanations, fashion advice, body analysis"
    used_by: [SYS-001, SYS-002, SYS-005, SYS-018]
    env_var: OPENAI_API_KEY

  - id: INT-002
    name: "Replicate API"
    type: integration
    provider: Replicate
    models: [prunaai/p-image-try-on, zhengchong/CatVTON, ZhengPeng7/BiRefNet, thibaud/controlnet-openpose-sdxl-1.0, h94/IP-Adapter, sczhou/CodeFormer]
    purpose: "GPU inference for VTON, garment extraction, image generation, face preservation"
    used_by: [SYS-002, SYS-005, SYS-015]
    env_var: REPLICATE_API_TOKEN

  - id: INT-003
